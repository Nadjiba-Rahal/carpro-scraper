name: CarPro Import Alcopa

on:
  schedule:
    # 2 fois par jour : 6h et 18h UTC (8h et 20h heure d'Alger)
    - cron: '0 6,18 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer les dépendances
        run: |
          pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Lancer le scraper
        env:
          WP_URL: ${{ secrets.WP_URL }}
          WP_API_KEY: ${{ secrets.WP_API_KEY }}
          SCRAPINGANT_KEY: ${{ secrets.SCRAPINGANT_KEY }}
        run: python scraper.py
