name: CarPro Import Alcopa

on:
  schedule:
    - cron: '0 6,18 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer Chrome + xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y wget xvfb unzip
          # Chrome version compatible
          wget -q -O /tmp/chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get install -y /tmp/chrome.deb

      - name: Installer les dépendances Python
        run: |
          pip install --upgrade pip
          pip install undetected-chromedriver==3.5.5 beautifulsoup4 requests

      - name: Lancer le scraper (avec xvfb)
        env:
          WP_URL: ${{ secrets.WP_URL }}
          WP_API_KEY: ${{ secrets.WP_API_KEY }}
        run: |
          xvfb-run -a --server-args="-screen 0 1920x1080x24" python scraper.py

      - name: Upload debug HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-html
          path: debug_home.html
          if-no-files-found: ignore
