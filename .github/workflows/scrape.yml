name: CarPro Import VPauto

on:
  schedule:
    - cron: '0 */2 * * *'   # toutes les 2h
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer les dépendances
        run: |
          pip install --upgrade pip
          pip install playwright playwright-stealth curl_cffi beautifulsoup4 requests
          python -m playwright install --with-deps chromium

      - name: Lancer le scraper
        env:
          WP_URL: ${{ secrets.WP_URL }}
          WP_API_KEY: ${{ secrets.WP_API_KEY }}
        run: python scraper.py
